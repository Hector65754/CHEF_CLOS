
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chef Clos</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Trebuchet MS', sans-serif;
}

body{
    background:
    radial-gradient(circle at center,#1c1c1c 0%, #050505 70%);
    overflow-x:hidden;
    min-height:100vh;
    color:white;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    linear-gradient(rgba(255,120,0,0.05) 2px, transparent 2px),
    linear-gradient(90deg, rgba(255,120,0,0.05) 2px, transparent 2px);
    background-size:40px 40px;
    pointer-events:none;
}

.spark{
    position:fixed;
    bottom:-20px;
    width:10px;
    height:10px;
    background:orange;
    border-radius:50%;
    box-shadow:0 0 10px orange;
    animation:subir linear infinite;
}

@keyframes subir{
    from{ transform:translateY(0px); opacity:1; }
    to{ transform:translateY(-120vh); opacity:0; }
}

.container{
    position:relative;
    z-index:2;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.logo{
    width:420px;
    max-width:95%;
    margin-bottom:25px;
    filter:
    drop-shadow(0 0 15px rgba(255,90,0,0.9))
    drop-shadow(0 0 30px rgba(255,120,0,0.6));
    animation:logoFloat 3s infinite alternate;
}

@keyframes logoFloat{
    from{ transform:translateY(0px); }
    to{ transform:translateY(-8px); }
}

/* ASADOR ARGENTINO */

.asador{
    width:460px;
    height:300px;
    max-width:95%;
    background:linear-gradient(to bottom,#2d2d2d,#111);
    border:10px solid #5f5f5f;
    border-radius:20px;
    position:relative;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
    box-shadow:
    0 0 30px orange,
    inset 0 0 35px black,
    0 20px 30px rgba(0,0,0,0.8);
}

.asador:hover{
    transform:scale(1.03);
}

.asador::before,
.asador::after{
    content:"";
    position:absolute;
    width:20px;
    height:90px;
    background:#444;
    bottom:-70px;
}

.asador::before{ left:70px; }
.asador::after{ right:70px; }

/* REJILLA */

.rejilla{
    position:absolute;
    inset:18px;
    border-radius:10px;
    background:
    repeating-linear-gradient(
        90deg,
        transparent,
        transparent 18px,
        #888 18px,
        #888 22px
    ),
    repeating-linear-gradient(
        0deg,
        transparent,
        transparent 18px,
        #888 18px,
        #888 22px
    );
    opacity:0.9;
}

/* LEÑA */

.tronco{
    position:absolute;
    bottom:8px;
    width:95px;
    height:24px;
    border-radius:14px;
    background:linear-gradient(to right,#44210d,#8b4513,#44210d);
    box-shadow:0 0 15px rgba(0,0,0,0.7);
}

.t1{ left:25px; transform:rotate(-8deg);}
.t2{ left:120px; transform:rotate(10deg);}
.t3{ left:220px; transform:rotate(-6deg);}
.t4{ left:325px; transform:rotate(8deg);}

/* FUEGO */

.fuego{
    position:absolute;
    bottom:15px;
    width:100%;
    height:130px;
    background:
    radial-gradient(circle at 20% 100%, yellow 0%, transparent 30%),
    radial-gradient(circle at 40% 100%, orange 0%, transparent 35%),
    radial-gradient(circle at 60% 100%, red 0%, transparent 40%),
    radial-gradient(circle at 80% 100%, orange 0%, transparent 35%);
    animation:fuegoMove 1s infinite alternate;
}

@keyframes fuegoMove{
    from{ transform:scaleY(1); }
    to{ transform:scaleY(1.25); }
}

/* HAMBURGUESAS */

.carne{
    position:absolute;
    top:95px;
    width:85px;
    height:28px;
    background:#4b1e10;
    border-radius:50px;
    box-shadow:
    inset 0 -5px 0 rgba(0,0,0,0.3),
    0 0 12px rgba(255,80,0,0.5);
    animation:cocinar 2s infinite alternate;
}

.c1{ left:70px; }
.c2{ left:185px; }
.c3{ left:300px; }

@keyframes cocinar{
    from{ filter:brightness(1); }
    to{ filter:brightness(1.25); }
}

.asador-text{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:32px;
    font-weight:bold;
    text-align:center;
    text-shadow:0 0 10px black;
}

.panel{
    display:none;
    margin-top:35px;
    width:90%;
    max-width:720px;
    background:rgba(15,15,15,0.95);
    border:4px solid orange;
    border-radius:22px;
    padding:25px;
    box-shadow:0 0 30px orange;
    animation:aparecer 0.4s ease;
}

@keyframes aparecer{
    from{ opacity:0; transform:translateY(20px);}
    to{ opacity:1; transform:translateY(0px);}
}

.botones{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:20px;
}

.btn{
    flex:1;
    min-width:180px;
    padding:16px;
    text-align:center;
    text-decoration:none;
    color:white;
    background:linear-gradient(45deg,#ff6600,#ff2200);
    border:3px solid #ff9900;
    border-radius:14px;
    font-size:22px;
    font-weight:bold;
    transition:0.3s;
    box-shadow:0 0 15px red;
}

.btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px orange;
}

.menu, .info{
    background:#111;
    border:3px solid #ff8800;
    border-radius:16px;
    padding:22px;
    margin-top:18px;
    font-size:20px;
    line-height:1.8;
}

.decor{
    text-align:center;
    font-size:36px;
    margin-bottom:15px;
}

</style>
</head>

    spark.style.left=Math.random()*100+'%';
    spark.style.animationDuration=(2+Math.random()*5)+'s';
    spark.style.animationDelay=Math.random()*5+'s';

    document.body.appendChild(spark);
}

</script>
